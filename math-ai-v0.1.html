<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>数学AI v0.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f6f2e8;
    --paper-line: #ded5b8;
    --ink: #1f2c42;
    --ink-soft: #5b6579;
    --red: #c1432f;
    --red-soft: #e7a89b;
    --blue: #3b6ea5;
    --green: #4c8c63;
    --card: #fffdf7;
    --card-border: #e4dcc4;
    --shadow: rgba(31,44,66,0.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: var(--ink);
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px) 0 0/34px 100%,
      var(--paper);
    background-attachment: fixed;
    display:flex;
    justify-content:center;
    min-height:100%;
  }
  .app{
    width:100%;
    max-width: 480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background: linear-gradient(180deg, rgba(246,242,232,0) 0%, rgba(246,242,232,0.55) 40px, var(--paper) 90px);
    position:relative;
  }
  /* 左端の赤い綴じ線 (ノート風) */
  .app::before{
    content:"";
    position:absolute; top:0; bottom:0; left:26px;
    width:2px; background: var(--red-soft); opacity:.55;
    pointer-events:none;
  }

  header{
    padding: 18px 20px 14px 40px;
    display:flex; align-items:baseline; gap:10px;
    border-bottom: 1.5px solid var(--paper-line);
    background: rgba(246,242,232,0.85);
    backdrop-filter: blur(2px);
    position: sticky; top:0; z-index:5;
  }
  header .icon{ flex-shrink:0; }
  header h1{
    font-family:'Kaisei Decol', serif;
    font-weight:700;
    font-size: 26px;
    margin:0;
    letter-spacing:.02em;
    color: var(--ink);
  }
  header .badge{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: var(--red);
    border:1.3px solid var(--red);
    border-radius: 20px;
    padding: 2px 8px;
    font-weight:700;
    transform: rotate(-4deg);
    white-space:nowrap;
  }
  header .sub{
    font-size:11px;
    color: var(--ink-soft);
    margin-left:auto;
    text-align:right;
    line-height:1.4;
  }

  .chat{
    flex:1;
    overflow-y:auto;
    padding: 18px 16px 18px 40px;
    display:flex;
    flex-direction:column;
    gap: 16px;
  }
  .empty-hint{
    margin-top: 30px;
    color: var(--ink-soft);
    font-size: 13px;
    line-height:2;
    text-align:center;
    padding: 0 20px;
  }
  .empty-hint b{ color:var(--ink); }

  .row{ display:flex; }
  .row.user{ justify-content:flex-end; }
  .row.ai{ justify-content:flex-start; }

  .bubble{
    max-width: 82%;
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: 0 2px 6px var(--shadow);
    font-size: 15px;
    line-height:1.6;
  }
  .bubble.user{
    background: var(--ink);
    color: #f6f2e8;
    border-bottom-right-radius: 4px;
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:16px;
    letter-spacing:.02em;
  }
  .bubble.ai{
    background: var(--card);
    border: 1.4px solid var(--card-border);
    border-left: 3px solid var(--red);
    border-bottom-left-radius: 4px;
    color: var(--ink);
  }
  .bubble.ai.error{ border-left-color: var(--red); }

  .steps{ display:flex; flex-direction:column; gap:6px; margin: 2px 0 10px 0;}
  .step{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .step .num{
    color: var(--red);
    font-weight:700;
    font-size:11px;
    background: rgba(193,67,47,0.08);
    border-radius:50%;
    width:16px; height:16px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .step .expr{ color: var(--ink); }
  .step .arrow{ color: var(--red-soft); }
  .step .val{ color: var(--red); font-weight:700; }

  .final{
    margin-top: 4px;
    padding-top: 10px;
    border-top: 1.5px dashed var(--card-border);
    display:flex; align-items:baseline; gap:8px;
    font-family:'JetBrains Mono', monospace;
  }
  .final .label{ font-size:12px; color: var(--ink-soft); }
  .final .value{
    font-size: 22px;
    font-weight:700;
    color: var(--red);
    text-decoration: underline wavy var(--red-soft) 2px;
    text-underline-offset: 4px;
  }
  .no-steps{ font-size:12.5px; color: var(--ink-soft); margin-bottom:6px; }

  .bubble.ai.error .final .value{ color: var(--red); text-decoration:none; }
  .err-msg{ font-size:14px; color: var(--red); font-weight:600; }

  /* --- 入力プレビュー(数式バー) --- */
  .composer{
    border-top: 1.5px solid var(--paper-line);
    background: rgba(255,253,247,0.9);
    backdrop-filter: blur(2px);
    padding: 12px 16px 14px;
    position: sticky; bottom:0;
  }
  .preview-wrap{
    background: var(--card);
    border: 1.4px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    min-height: 48px;
    display:flex;
    align-items:center;
    box-shadow: inset 0 1px 3px rgba(31,44,66,0.05);
  }
  #preview{
    font-family:'JetBrains Mono', monospace;
    font-size: 19px;
    font-weight:600;
    color: var(--ink);
    letter-spacing: .01em;
    word-break: break-all;
    line-height:1.4;
  }
  #preview .placeholder{ color: #b9b0a0; font-weight:400; }
  .cursor{
    display:inline-block;
    width:2px; height:19px;
    background: var(--red);
    margin-left:2px;
    vertical-align: -3px;
    animation: blink 1s step-start infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .keypad{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
  }
  .key{
    appearance:none;
    border:none;
    border-radius: 10px;
    padding: 13px 0;
    font-family:'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight:600;
    background: var(--card);
    border: 1.3px solid var(--card-border);
    color: var(--ink);
    cursor:pointer;
    transition: transform .06s ease, background .12s ease;
    box-shadow: 0 2px 0 var(--card-border);
  }
  .key:active{
    transform: translateY(2px);
    box-shadow: 0 0px 0 var(--card-border);
  }
  .key.op{ color: var(--blue); }
  .key.func{ color: var(--red); font-size:15px; }
  .key.clear{ color: var(--red); border-color: var(--red-soft); }
  .key.back{ color: var(--ink-soft); }
  .key.equals{
    background: var(--red);
    color: #fffdf7;
    border-color: var(--red);
    grid-column: span 2;
    font-size:16px;
    box-shadow: 0 2px 0 #8f2f1f;
  }
  .key.equals:active{ box-shadow:0 0 0 #8f2f1f; }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background: var(--card-border); border-radius:4px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <svg class="icon" width="30" height="30" viewBox="0 0 30 30" fill="none">
      <rect x="4" y="4" width="22" height="22" rx="5" stroke="#1f2c42" stroke-width="2"/>
      <path d="M9 14.5H21" stroke="#c1432f" stroke-width="2" stroke-linecap="round"/>
      <path d="M9 19.5H16" stroke="#3b6ea5" stroke-width="2" stroke-linecap="round"/>
      <circle cx="21" cy="9.5" r="1.6" fill="#c1432f"/>
      <circle cx="9" cy="9.5" r="1.6" fill="#3b6ea5"/>
    </svg>
    <h1>数学AI</h1>
    <span class="badge">v0.1</span>
    <div class="sub">計算チャット<br>ポチポチ入力</div>
  </header>

  <div class="chat" id="chat">
    <div class="empty-hint" id="hint">
      下のキーパッドで式を組み立てて、<br>
      <b>=</b> を押すと計算過程が返ってきます。<br>
      例）<b>3+4×2</b> や <b>√(9)+2^3</b>
    </div>
  </div>

  <div class="composer">
    <div class="preview-wrap">
      <div id="preview"><span class="placeholder">式をここに入力…</span></div>
    </div>
    <div class="keypad" id="keypad">
      <button class="key func" data-action="sqrt">√</button>
      <button class="key" data-action="paren-open">(</button>
      <button class="key" data-action="paren-close">)</button>
      <button class="key back" data-action="back">⌫</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key op" data-op="÷">÷</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key op" data-op="×">×</button>

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key op" data-op="-">−</button>

      <button class="key" data-num="0">0</button>
      <button class="key" data-num=".">.</button>
      <button class="key func" data-action="pi">π</button>
      <button class="key op" data-op="+">+</button>

      <button class="key op" data-op="^">^</button>
      <button class="key op" data-op="%">%</button>
      <button class="key clear" data-action="clear">C</button>
      <button class="key equals" data-action="equals">=</button>
    </div>
  </div>
</div>

<script>
/* ===================== 状態管理 ===================== */
// tokens: [{type:'num'|'op'|'lparen'|'rparen'|'sqrt'|'pi', value:string}]
let tokens = [];

const OPS = ['+','-','×','÷','^','%'];

function lastToken(){ return tokens[tokens.length-1] || null; }

function openParenCount(){
  let c = 0;
  for(const t of tokens){ if(t.type==='lparen') c++; if(t.type==='rparen') c--; }
  return c;
}

function canStartFactor(t){
  return !t || t.type==='op' || t.type==='lparen' || t.type==='sqrt';
}

function pushDigit(d){
  const last = lastToken();
  if(last && last.type==='num'){
    if(d==='.' && last.value.includes('.')) return; // 小数点は1つまで
    last.value += d;
  } else {
    // 直前が数字/π/閉じ括弧なら、暗黙の×は挟まず新しい数値として続けさせない設計
    // (通常は演算子や開き括弧の後、または最初に呼ばれる)
    if(last && (last.type==='num' || last.type==='pi' || last.type==='rparen')){
      // 直後にもう一つの数値ブロックを始める= 暗黙の掛け算として扱う
      tokens.push({type:'op', value:'×'});
    }
    tokens.push({type:'num', value: d==='.' ? '0.' : d});
  }
  render();
}

function pushOp(op){
  const last = lastToken();
  if(!last){
    if(op==='-'){ tokens.push({type:'op', value:'-', unary:true}); render(); }
    return; // 先頭にいきなり + や × は無効
  }
  if(last.type==='op'){
    // 直前が演算子の場合、マイナスだけは単項として上書き可能、それ以外は置換
    if(op==='-' ){ tokens.push({type:'op', value:'-', unary:true}); render(); return; }
    tokens[tokens.length-1] = {type:'op', value: op};
    render();
    return;
  }
  if(last.type==='lparen'){
    if(op==='-'){ tokens.push({type:'op', value:'-', unary:true}); render(); }
    return;
  }
  tokens.push({type:'op', value: op});
  render();
}

function pushParenOpen(){
  const last = lastToken();
  if(last && (last.type==='num' || last.type==='pi' || last.type==='rparen')){
    tokens.push({type:'op', value:'×'});
  }
  tokens.push({type:'lparen', value:'('});
  render();
}

function pushParenClose(){
  const last = lastToken();
  if(!last || last.type==='op' || last.type==='lparen') return;
  if(openParenCount() <= 0) return;
  tokens.push({type:'rparen', value:')'});
  render();
}

function pushSqrt(){
  const last = lastToken();
  if(last && (last.type==='num' || last.type==='pi' || last.type==='rparen')){
    tokens.push({type:'op', value:'×'});
  }
  tokens.push({type:'sqrt', value:'√'});
  render();
}

function pushPi(){
  const last = lastToken();
  if(last && (last.type==='num' || last.type==='pi' || last.type==='rparen')){
    tokens.push({type:'op', value:'×'});
  }
  tokens.push({type:'pi', value:'π'});
  render();
}

function backspace(){
  const last = lastToken();
  if(!last) return;
  if(last.type==='num' && last.value.length>1){
    last.value = last.value.slice(0,-1);
  } else {
    tokens.pop();
  }
  render();
}

function clearAll(){
  tokens = [];
  render();
}

/* ===================== 表示 ===================== */
function displayStringForToken(t){
  if(t.type==='op' && t.unary && t.value==='-') return '−';
  if(t.type==='op'){
    if(t.value==='-') return '−';
    return t.value;
  }
  return t.value;
}

function render(){
  const preview = document.getElementById('preview');
  if(tokens.length===0){
    preview.innerHTML = '<span class="placeholder">式をここに入力…</span><span class="cursor"></span>';
    return;
  }
  const str = tokens.map(displayStringForToken).join(' ');
  preview.innerHTML = escapeHtml(str) + '<span class="cursor"></span>';
  preview.scrollLeft = preview.scrollWidth;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ===================== パーサー ===================== */
// 再帰下降パーサー: expr -> term(( + | - )term)*
//                    term -> power(( × | ÷ | % ) power | implicit power)*
//                    power -> unary ( ^ power )?
//                    unary -> ( - unary ) | ( √ unary ) | postfix
//                    postfix -> primary
//                    primary -> NUM | PI | ( expr )

class ParseError extends Error{}

function parse(tokenList){
  let pos = 0;
  function peek(){ return tokenList[pos]; }
  function next(){ return tokenList[pos++]; }

  function parseExpr(){
    let node = parseTerm();
    while(peek() && peek().type==='op' && !peek().unary && (peek().value==='+' || peek().value==='-')){
      const op = next().value;
      const right = parseTerm();
      node = {type:'binop', op, left:node, right};
    }
    return node;
  }

  function parseTerm(){
    let node = parsePower();
    while(true){
      const t = peek();
      if(t && t.type==='op' && !t.unary && (t.value==='×' || t.value==='÷' || t.value==='%')){
        next();
        const right = parsePower();
        node = {type:'binop', op:t.value, left:node, right};
      } else if(t && canStartFactor(t) && t.type!=='op'){
        // 暗黙の掛け算 例: 2( 、 2π 、 )(
        const right = parsePower();
        node = {type:'binop', op:'×', left:node, right};
      } else {
        break;
      }
    }
    return node;
  }

  function parsePower(){
    const base = parseUnary();
    const t = peek();
    if(t && t.type==='op' && !t.unary && t.value==='^'){
      next();
      const exp = parsePower(); // 右結合
      return {type:'binop', op:'^', left:base, right:exp};
    }
    return base;
  }

  function parseUnary(){
    const t = peek();
    if(t && t.type==='op' && t.unary && t.value==='-'){
      next();
      return {type:'neg', val: parseUnary()};
    }
    if(t && t.type==='sqrt'){
      next();
      return {type:'sqrt', val: parseUnary()};
    }
    return parsePrimary();
  }

  function parsePrimary(){
    const t = peek();
    if(!t) throw new ParseError('式が不完全です');
    if(t.type==='num'){
      next();
      const v = parseFloat(t.value);
      if(isNaN(v)) throw new ParseError('数値の形式が正しくありません');
      return {type:'num', value:v};
    }
    if(t.type==='pi'){
      next();
      return {type:'num', value: Math.PI, label:'π'};
    }
    if(t.type==='lparen'){
      next();
      const inner = parseExpr();
      const close = peek();
      if(!close || close.type!=='rparen') throw new ParseError('括弧が閉じられていません');
      next();
      return {type:'group', val: inner};
    }
    throw new ParseError('式の書き方が正しくありません');
  }

  const result = parseExpr();
  if(pos < tokenList.length) throw new ParseError('式の書き方が正しくありません');
  return result;
}

/* ===================== 評価 + ステップ記録 ===================== */
function formatNum(v){
  if(!isFinite(v)) throw new ParseError('計算できない値になりました');
  let r = Math.round(v*1e9)/1e9;
  if(Object.is(r,-0)) r = 0;
  if(Math.abs(r) < 1e15){
    return r.toString();
  }
  return r.toExponential(4);
}

function evalNode(node, steps){
  switch(node.type){
    case 'num':
      return { value: node.value, text: node.label ? node.label : formatNum(node.value) };
    case 'group':
      return evalNode(node.val, steps);
    case 'neg': {
      const v = evalNode(node.val, steps);
      const result = -v.value;
      steps.push({ expr: `−${v.text}`, val: formatNum(result) });
      return { value: result, text: formatNum(result) };
    }
    case 'sqrt': {
      const v = evalNode(node.val, steps);
      if(v.value < 0) throw new ParseError('負の数の√は計算できません');
      const result = Math.sqrt(v.value);
      steps.push({ expr: `√${v.text}`, val: formatNum(result) });
      return { value: result, text: formatNum(result) };
    }
    case 'binop': {
      const l = evalNode(node.left, steps);
      const r = evalNode(node.right, steps);
      let result;
      switch(node.op){
        case '+': result = l.value + r.value; break;
        case '-': result = l.value - r.value; break;
        case '×': result = l.value * r.value; break;
        case '÷':
          if(r.value === 0) throw new ParseError('0では割れません');
          result = l.value / r.value; break;
        case '^': result = Math.pow(l.value, r.value); break;
        case '%':
          // a % b は「aをbで割った余り」ではなく、電卓的な a×(b/100) の百分率演算として扱う
          result = l.value * (r.value / 100); break;
        default: throw new ParseError('未対応の演算子です');
      }
      steps.push({ expr: `${l.text} ${node.op} ${r.text}`, val: formatNum(result) });
      return { value: result, text: formatNum(result) };
    }
    default:
      throw new ParseError('式を解析できませんでした');
  }
}

function compute(tokenList){
  if(tokenList.length===0) throw new ParseError('式が入力されていません');
  if(openParenCountFor(tokenList) !== 0) throw new ParseError('括弧が閉じられていません');
  const cleaned = tokenList.map(t=>{
    if(t.type==='num' && (t.value===''||t.value==='.'||t.value==='0.')){
      throw new ParseError('数値が未入力です');
    }
    return t;
  });
  const ast = parse(cleaned);
  const steps = [];
  const result = evalNode(ast, steps);
  return { steps, value: result.value, text: result.text };
}

function openParenCountFor(list){
  let c=0;
  for(const t of list){ if(t.type==='lparen') c++; if(t.type==='rparen') c--; }
  return c;
}

/* ===================== チャット描画 ===================== */
function exprDisplayString(tokenList){
  return tokenList.map(displayStringForToken).join(' ');
}

function addUserBubble(text){
  const chat = document.getElementById('chat');
  const hint = document.getElementById('hint');
  if(hint) hint.remove();
  const row = document.createElement('div');
  row.className = 'row user';
  row.innerHTML = `<div class="bubble user">${escapeHtml(text)}</div>`;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function addAiBubble({steps, value, text, error}){
  const chat = document.getElementById('chat');
  const row = document.createElement('div');
  row.className = 'row ai';
  if(error){
    row.innerHTML = `<div class="bubble ai error">
      <div class="err-msg">⚠️ ${escapeHtml(error)}</div>
    </div>`;
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return;
  }
  let stepsHtml = '';
  if(steps.length === 0){
    stepsHtml = `<div class="no-steps">この式はすでに1つの値なので、計算の途中式はありません。</div>`;
  } else {
    stepsHtml = '<div class="steps">' + steps.map((s,i)=>`
      <div class="step">
        <span class="num">${i+1}</span>
        <span class="expr">${escapeHtml(s.expr)}</span>
        <span class="arrow">→</span>
        <span class="val">${escapeHtml(s.val)}</span>
      </div>`).join('') + '</div>';
  }
  row.innerHTML = `<div class="bubble ai">
    ${stepsHtml}
    <div class="final"><span class="label">こたえ</span><span class="value">${escapeHtml(text)}</span></div>
  </div>`;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

/* ===================== イベント ===================== */
document.getElementById('keypad').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const num = btn.dataset.num;
  const op = btn.dataset.op;
  const action = btn.dataset.action;

  if(num !== undefined){ pushDigit(num); return; }
  if(op !== undefined){ pushOp(op); return; }

  switch(action){
    case 'paren-open': pushParenOpen(); break;
    case 'paren-close': pushParenClose(); break;
    case 'sqrt': pushSqrt(); break;
    case 'pi': pushPi(); break;
    case 'back': backspace(); break;
    case 'clear': clearAll(); break;
    case 'equals': submit(); break;
  }
});

function submit(){
  if(tokens.length===0) return;
  const userText = exprDisplayString(tokens);
  addUserBubble(userText);
  try{
    const result = compute(tokens);
    addAiBubble(result);
  }catch(err){
    addAiBubble({ error: err.message || '計算できませんでした' });
  }
  clearAll();
}

// 物理キーボードにも一部対応(任意入力の補助)
window.addEventListener('keydown', (e)=>{
  const map = { '*':'×', '/':'÷', '+':'+', '-':'-' };
  if(/^[0-9]$/.test(e.key)){ pushDigit(e.key); }
  else if(e.key==='.'){ pushDigit('.'); }
  else if(map[e.key]){ pushOp(map[e.key]); }
  else if(e.key==='^'){ pushOp('^'); }
  else if(e.key==='%'){ pushOp('%'); }
  else if(e.key==='('){ pushParenOpen(); }
  else if(e.key===')'){ pushParenClose(); }
  else if(e.key==='Backspace'){ backspace(); }
  else if(e.key==='Enter' || e.key==='='){ submit(); }
  else if(e.key==='Escape'){ clearAll(); }
});

render();
</script>
